name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: bash ci/build-ci.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bubble-float-apk
          path: bubble-float.apk
